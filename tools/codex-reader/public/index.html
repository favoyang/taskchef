<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Chats</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Codex Chats</div>
    <div class="filters">
      <label class="select-wrap">
        <select id="project" aria-label="Project">
          <option value="">All projects</option>
        </select>
      </label>
      <button id="pinned" class="toggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l7 7-3 1-4 4-1 5-2 2-3-6-5-3 2-2 5-1 4-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Pinned</span>
      </button>
      <button id="scheduled" class="toggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Scheduled</span>
      </button>
      <button id="archived" class="toggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11.5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 4.5h18V8H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Archived</span>
      </button>
      <button id="theme" class="icon-button" type="button" aria-label="Use dark theme" title="Use dark theme">
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="sidebar" aria-label="Chats">
      <div id="list" class="list" role="listbox" aria-label="Chats"></div>
    </section>

    <section class="thread" aria-label="Chat">
      <div id="thread-empty" class="empty">Select a chat</div>
      <article id="thread-view" class="thread-view" hidden>
        <header class="thread-head">
          <h1 id="thread-title"></h1>
          <div id="thread-flags" class="thread-flags"></div>
        </header>
        <div id="messages" class="messages"></div>
      </article>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
