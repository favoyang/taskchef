<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TaskChef Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">TaskChef</p>
        <div class="title-row">
          <picture class="dashboard-icon" aria-hidden="true">
            <source srcset="/assets/taskchef-dark.svg" media="(prefers-color-scheme: dark)">
            <img src="/assets/taskchef.svg" alt="" width="48" height="48">
          </picture>
          <h1>TaskChef Dashboard</h1>
        </div>
        <p class="subtitle">Latest delegated work, updated as TaskChef reports change.</p>
      </div>
      <div class="connection" role="status" aria-live="polite">
        <span id="connection-dot" class="connection-dot"></span>
        <span id="connection-label">Connecting…</span>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Task filters">
        <label>
          Project
          <select id="project-filter">
            <option value="">All projects</option>
          </select>
        </label>
        <label>
          Status
          <select id="status-filter">
            <option value="">All statuses</option>
          </select>
        </label>
        <label>
          Updated
          <select id="date-filter">
            <option value="24h">Latest 24 hours</option>
            <option value="7d">Latest 7 days</option>
            <option value="all" selected>All time</option>
          </select>
        </label>
        <p id="task-count" class="task-count" aria-live="polite"></p>
      </section>

      <div id="dashboard-message" class="dashboard-message" hidden>
        <span id="dashboard-message-text" role="status" aria-live="polite"></span>
        <button id="dismiss-dashboard-message" class="icon-button" type="button" aria-label="Dismiss dashboard message">×</button>
      </div>
      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="visually-hidden">Tasks</h2>
        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h2>No tasks match these filters</h2>
          <p>Choose a different project or status to see more work.</p>
        </div>
      </section>
    </main>

    <aside id="notifications" class="notifications" aria-label="Task notifications" hidden>
      <div class="notifications-heading">
        <strong>Updates</strong>
        <button id="clear-notifications" class="text-button" type="button">Clear all</button>
      </div>
      <p id="notification-announcer" class="visually-hidden" role="status" aria-live="polite"></p>
      <div id="toast-list" class="toast-list"></div>
    </aside>

    <dialog id="task-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p id="dialog-project" class="eyebrow"></p>
          <h2 id="dialog-title"></h2>
        </div>
        <button id="close-dialog" class="icon-button" type="button" aria-label="Close task details">×</button>
      </div>
      <div class="dialog-actions">
        <button id="open-codex" class="primary-button task-action" type="button" aria-label="Open this task in Codex">
          <picture class="codex-icon" aria-hidden="true">
            <source srcset="/assets/codex-app-dark.png" media="(prefers-color-scheme: dark)">
            <img src="/assets/codex-app-light.png" alt="" width="16" height="16">
          </picture>
          <span>Open task</span>
        </button>
        <button id="copy-thread-id" class="secondary-button" type="button">Copy thread ID</button>
      </div>
      <section>
        <h3>Result history</h3>
        <div id="dialog-results" class="result-history"></div>
      </section>
      <section>
        <h3>Original instruction</h3>
        <pre id="dialog-instruction"></pre>
      </section>
      <section>
        <h3>Metadata</h3>
        <dl id="dialog-metadata" class="metadata"></dl>
      </section>
    </dialog>
  </body>
</html>
