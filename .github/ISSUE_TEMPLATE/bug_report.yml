name: Bug report
description: Report a problem with TaskChef.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to see the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and operating system
      placeholder: TaskChef version, Codex version, operating system
  - type: textarea
    id: context
    attributes:
      label: Screenshots or logs
      description: Include useful details. Remove private chat text, credentials, and personal file paths.
