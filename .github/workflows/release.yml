name: Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate MCP app bundle
        run: |
          npm run check:mcp-app
          npm run build:mcp-app
          git diff --quiet -- src/mcp-app/dist/index.html

      - name: Validate package contents
        run: npm pack --dry-run

  release:
    name: Release
    needs: test
    outputs:
      expected-version: ${{ steps.expected-version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    if: >-
      github.repository == 'favoyang/taskchef' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@25 -p @semantic-release/exec -p @semantic-release/git semantic-release

      - name: Capture expected release version
        id: expected-version
        if: always()
        env:
          RETRY_PUBLISHED_VERSION: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/write-release-version-output.js

  marketplace:
    name: Update plugin marketplace
    needs:
      - test
      - release
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.expected-version != '' &&
      github.repository == 'favoyang/taskchef' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout TaskChef
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Update TaskChef marketplace
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.expected-version }}
        run: node scripts/update-plugin-marketplace.js .agents/plugins/marketplace.json "$EXPECTED_VERSION"

      - name: Publish TaskChef marketplace update
        run: |
          git add .agents/plugins/marketplace.json
          if git diff --cached --quiet; then
            exit 0
          fi
          source=$(node -p "require('./.agents/plugins/marketplace.json').plugins.find(plugin => plugin.name === 'taskchef').source.version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update TaskChef marketplace to ${source} [skip ci]"
          git push origin HEAD:main
